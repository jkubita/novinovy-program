<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novinový program</title>
  <meta name="description" content="Co bylo kdy na titulních stránkách českých zpravodajských webů.">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1><a href="./" title="Znovu načíst">Novinový program</a></h1>
      <p class="tagline">Co bylo kdy na titulních stránkách, po hodinách</p>
    </div>
    <nav class="controls" aria-label="Ovládání">
      <div class="daynav">
        <button id="prev" type="button" aria-label="Předchozí den">‹</button>
        <select id="day" aria-label="Den"></select>
        <button id="next" type="button" aria-label="Další den">›</button>
      </div>
      <label class="opt">Článků
        <select id="depth">
          <option value="1" selected>1</option>
          <option value="3">3</option>
          <option value="5">5</option>
        </select>
      </label>
    </nav>
  </header>

  <p id="status" class="status" role="status"></p>

  <main id="board" class="board" aria-live="polite"></main>

  <dialog id="detail">
    <form method="dialog"><button class="close" aria-label="Zavřít">×</button></form>
    <div id="detail-body"></div>
  </dialog>

  <footer class="foot">
    Titulní strany předních českých zpravodajských webů. Autor projektu Jan Kubita. Titulky a perexy © jednotliví vydavatelé.
    Data se stahují automaticky každou hodinu.
  </footer>
  <script>
    // Když skript selže (např. starší verze v cache prohlížeče), ukážeme hlášku místo prázdné stránky.
    window.addEventListener("error", function () {
      var b = document.getElementById("board");
      if (b && !b.querySelector(".timeline")) b.innerHTML = '<p class="empty-state">Stránku se nepodařilo načíst. Zkuste ji obnovit (Ctrl+F5).</p>';
    });
  </script>
  <!-- Při změně app.js nebo style.css zvyšte ?v=, jinak prohlížeče můžou míchat starou a novou verzi. -->
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
